<style>
  :root {
    color-scheme: light;

    --color-background: #f3f6fb;
    --color-surface: #ffffff;
    --color-surface-muted: #f8fafc;
    --color-surface-strong: #e8eef8;

    --color-border: #dbe3ef;
    --color-border-strong: #c8d3e2;

    --color-text: #172033;
    --color-text-muted: #667085;
    --color-text-soft: #8a94a6;

    --color-primary: #2563eb;
    --color-primary-dark: #1d4ed8;
    --color-primary-soft: #dbeafe;
    --color-primary-contrast: #ffffff;

    --color-success: #15803d;
    --color-success-soft: #dcfce7;

    --color-warning: #b45309;
    --color-warning-soft: #fef3c7;

    --color-danger: #b42318;
    --color-danger-soft: #fee4e2;

    --color-info: #0369a1;
    --color-info-soft: #e0f2fe;

    --sidebar-width: 268px;
    --sidebar-collapsed-width: 84px;
    --header-height: 76px;
    --footer-height: 48px;

    --radius-small: 8px;
    --radius-medium: 12px;
    --radius-large: 18px;
    --radius-pill: 999px;

    --shadow-small: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-medium: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-large: 0 18px 48px rgba(15, 23, 42, 0.14);

    --transition-fast: 150ms ease;
    --transition-standard: 220ms ease;

    --font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  [data-theme="dark"] {
    color-scheme: dark;

    --color-background: #0f172a;
    --color-surface: #111827;
    --color-surface-muted: #172033;
    --color-surface-strong: #1e293b;

    --color-border: #263449;
    --color-border-strong: #334155;

    --color-text: #f8fafc;
    --color-text-muted: #b7c0cf;
    --color-text-soft: #8691a4;

    --color-primary: #60a5fa;
    --color-primary-dark: #3b82f6;
    --color-primary-soft: #1e3a5f;
    --color-primary-contrast: #08111f;

    --color-success: #4ade80;
    --color-success-soft: #153923;

    --color-warning: #fbbf24;
    --color-warning-soft: #45330d;

    --color-danger: #f87171;
    --color-danger-soft: #4a1f24;

    --color-info: #38bdf8;
    --color-info-soft: #12384b;

    --shadow-small: 0 1px 2px rgba(0, 0, 0, 0.2);
    --shadow-medium: 0 8px 24px rgba(0, 0, 0, 0.24);
    --shadow-large: 0 18px 48px rgba(0, 0, 0, 0.34);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--color-background);
    scroll-behavior: smooth;
  }

  body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    background: var(--color-background);
    color: var(--color-text);
    font-family: var(--font-family);
    font-size: 16px;
    line-height: 1.5;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    color: inherit;
  }

  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 3px solid rgba(37, 99, 235, 0.28);
    outline-offset: 2px;
  }

  img,
  svg {
    display: block;
    max-width: 100%;
  }

  [hidden] {
    display: none !important;
  }

  .app-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    background: var(--color-background);
  }

  .app-sidebar {
    position: sticky;
    top: 0;
    z-index: 40;
    width: var(--sidebar-width);
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid var(--color-border);
    background: var(--color-surface);
    transition:
      width var(--transition-standard),
      transform var(--transition-standard);
  }

  .app-workspace {
    min-width: 0;
    min-height: 100vh;
    display: grid;
    grid-template-rows:
      var(--header-height)
      minmax(0, 1fr)
      var(--footer-height);
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 30;
    min-width: 0;
    border-bottom: 1px solid var(--color-border);
    background: color-mix(
      in srgb,
      var(--color-surface) 92%,
      transparent
    );
    backdrop-filter: blur(14px);
  }

  .app-main-content {
    width: 100%;
    min-width: 0;
    padding: 28px;
  }

  .app-footer {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--color-border);
    background: var(--color-surface);
  }

  .app-page {
    width: 100%;
    animation: page-enter 220ms ease;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 24px;
  }

  .page-header__eyebrow {
    margin: 0 0 6px;
    color: var(--color-primary);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .page-header__title {
    margin: 0;
    color: var(--color-text);
    font-size: clamp(1.9rem, 3vw, 2.6rem);
    line-height: 1.15;
  }

  .page-header__description {
    max-width: 720px;
    margin: 10px 0 0;
    color: var(--color-text-muted);
  }

  .app-state {
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 36px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .app-state__content {
    max-width: 520px;
  }

  .app-state__title {
    margin: 0;
    font-size: 1.35rem;
  }

  .app-state__message {
    margin: 8px 0 0;
    color: var(--color-text-muted);
  }

  .app-error-state {
    border-color: color-mix(
      in srgb,
      var(--color-danger) 30%,
      var(--color-border)
    );
  }

  .app-error-state__icon {
    width: 52px;
    height: 52px;
    display: grid;
    flex: 0 0 auto;
    place-items: center;
    border-radius: 50%;
    background: var(--color-danger-soft);
    color: var(--color-danger);
    font-size: 1.4rem;
    font-weight: 800;
  }

  .loading-spinner {
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    border: 4px solid var(--color-surface-strong);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spinner-rotate 800ms linear infinite;
  }

  .empty-state {
    min-height: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 42px 28px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    text-align: center;
  }

  .empty-state__icon {
    width: 68px;
    height: 68px;
    display: grid;
    place-items: center;
    margin-bottom: 18px;
    border-radius: var(--radius-large);
    background: var(--color-primary-soft);
    color: var(--color-primary);
    font-size: 1.7rem;
    font-weight: 800;
  }

  .empty-state__title {
    margin: 0;
    font-size: 1.25rem;
  }

  .empty-state__message {
    max-width: 560px;
    margin: 10px 0 18px;
    color: var(--color-text-muted);
  }

  .button {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1px solid transparent;
    border-radius: var(--radius-medium);
    cursor: pointer;
    font-weight: 700;
    text-decoration: none;
    transition:
      background-color var(--transition-fast),
      border-color var(--transition-fast),
      color var(--transition-fast),
      transform var(--transition-fast);
  }

  .button:hover {
    transform: translateY(-1px);
  }

  .button:active {
    transform: translateY(0);
  }

  .button--primary {
    border-color: var(--color-primary);
    background: var(--color-primary);
    color: var(--color-primary-contrast);
  }

  .button--primary:hover {
    border-color: var(--color-primary-dark);
    background: var(--color-primary-dark);
  }

  .button--secondary {
    border-color: var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
  }

  .button--secondary:hover {
    border-color: var(--color-border-strong);
    background: var(--color-surface-muted);
  }

  .button--ghost {
    border-color: transparent;
    background: transparent;
    color: var(--color-text-muted);
  }

  .button--ghost:hover {
    background: var(--color-surface-muted);
    color: var(--color-text);
  }

  .icon-button {
    width: 42px;
    height: 42px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    color: var(--color-text-muted);
    cursor: pointer;
    transition:
      background-color var(--transition-fast),
      border-color var(--transition-fast),
      color var(--transition-fast);
  }

  .icon-button:hover {
    border-color: var(--color-border-strong);
    background: var(--color-surface-muted);
    color: var(--color-text);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .status-badge--development {
    background: var(--color-warning-soft);
    color: var(--color-warning);
  }

  .status-badge--success {
    background: var(--color-success-soft);
    color: var(--color-success);
  }

  .status-badge--danger {
    background: var(--color-danger-soft);
    color: var(--color-danger);
  }

  .status-badge--info {
    background: var(--color-info-soft);
    color: var(--color-info);
  }

  .card {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .card__header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--color-border);
  }

  .card__body {
    padding: 22px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
  }

  .metric-card {
    min-width: 0;
    padding: 20px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .metric-card__label {
    margin: 0;
    color: var(--color-text-muted);
    font-size: 0.9rem;
    font-weight: 600;
  }

  .metric-card__value {
    margin: 10px 0 0;
    color: var(--color-text);
    font-size: clamp(1.6rem, 3vw, 2.15rem);
    font-weight: 800;
    line-height: 1.1;
  }

  .metric-card__meta {
    margin: 9px 0 0;
    color: var(--color-text-soft);
    font-size: 0.82rem;
  }

  .content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
    gap: 20px;
    margin-top: 20px;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    z-index: 35;
    border: 0;
    background: rgba(15, 23, 42, 0.55);
    cursor: pointer;
  }

  .toast-region {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 100;
    width: min(380px, calc(100vw - 40px));
    display: grid;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    padding: 14px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    color: var(--color-text);
    box-shadow: var(--shadow-large);
    pointer-events: auto;
    animation: toast-enter 180ms ease;
  }

  .app-noscript {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--color-background);
  }

  .app-noscript__content {
    width: 100%;
    max-width: 560px;
    padding: 30px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
  }

  .app-noscript__content h1 {
    margin-top: 0;
  }

  .app-noscript__content p {
    margin-bottom: 0;
    color: var(--color-text-muted);
  }

  @keyframes spinner-rotate {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes page-enter {
    from {
      opacity: 0;
      transform: translateY(4px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes toast-enter {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 1180px) {
    .metric-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .content-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 860px) {
    .app-shell {
      display: block;
    }

    .app-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      transform: translateX(-100%);
      box-shadow: var(--shadow-large);
    }

    .app-shell.is-sidebar-open .app-sidebar {
      transform: translateX(0);
    }

    .app-workspace {
      min-height: 100vh;
    }

    .app-main-content {
      padding: 22px 18px;
    }
  }

  @media (max-width: 620px) {
    .app-main-content {
      padding: 18px 14px;
    }

    .metric-grid {
      grid-template-columns: 1fr;
    }

    .page-header {
      display: block;
    }

    .app-state {
      min-height: 340px;
      flex-direction: column;
      text-align: center;
    }

    .empty-state {
      min-height: 320px;
      padding: 34px 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
