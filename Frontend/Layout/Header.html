<div class="header">
  <div class="header__left">
    <button
      id="sidebar-open-button"
      class="icon-button header__menu-button"
      type="button"
      aria-label="Open navigation"
      aria-expanded="false"
      title="Open navigation"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"
          fill="currentColor"
        />
      </svg>
    </button>

    <div class="header__page-copy">
      <p class="header__eyebrow">
        Personal finance workspace
      </p>

      <h1
        id="page-title"
        class="header__title"
      >
        Dashboard
      </h1>
    </div>
  </div>

  <div class="header__right">
    <label class="header-search">
      <span class="sr-only">
        Search Pay Tracker
      </span>

      <span
        class="header-search__icon"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="m20.71 19.29-3.4-3.4A8 8 0 1 0 15.9 17.3l3.4 3.4 1.41-1.41ZM5 11a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"
            fill="currentColor"
          />
        </svg>
      </span>

      <input
        id="global-search-input"
        class="header-search__input"
        type="search"
        placeholder="Search Pay Tracker"
        autocomplete="off"
        spellcheck="false"
      >

      <span class="header-search__shortcut">
        Ctrl K
      </span>
    </label>

    <div class="header__actions">
      <button
        id="refresh-app-button"
        class="icon-button"
        type="button"
        aria-label="Refresh Pay Tracker"
        title="Refresh Pay Tracker"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h8V3l-3.35 3.35Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <button
        id="theme-toggle-button"
        class="icon-button"
        type="button"
        aria-label="Use dark theme"
        title="Use dark theme"
      >
        <svg
          id="theme-light-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M12 4a8 8 0 1 0 8 8 8 8 0 0 0-8-8Zm0-3h1v2h-1V1Zm0 20h1v2h-1v-2ZM1 12h2v1H1v-1Zm20 0h2v1h-2v-1ZM4.22 3.51l1.42 1.42-.71.71-1.42-1.42.71-.71Zm14.14 14.14 1.42 1.42-.71.71-1.42-1.42.71-.71ZM3.51 19.78l1.42-1.42.71.71-1.42 1.42-.71-.71ZM17.65 5.64l1.42-1.42.71.71-1.42 1.42-.71-.71Z"
            fill="currentColor"
          />
        </svg>

        <svg
          id="theme-dark-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          hidden
        >
          <path
            d="M20.53 15.93A8 8 0 0 1 8.07 3.47 8.5 8.5 0 1 0 20.53 15.93Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <div class="profile">
        <button
          id="profile-button"
          class="profile-button"
          type="button"
          aria-label="Open profile menu"
          aria-expanded="false"
          aria-controls="profile-menu"
        >
          <span
            class="profile-button__avatar"
            aria-hidden="true"
          >
            DS
          </span>

          <span class="profile-button__copy">
            <span class="profile-button__name">
              Dean Stewart
            </span>

            <span class="profile-button__role">
              Pay Tracker owner
            </span>
          </span>

          <span
            class="profile-button__chevron"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="m7 10 5 5 5-5H7Z"
                fill="currentColor"
              />
            </svg>
          </span>
        </button>

        <div
          id="profile-menu"
          class="profile-menu"
          role="menu"
          hidden
        >
          <div class="profile-menu__header">
            <span class="profile-menu__avatar">
              DS
            </span>

            <div>
              <p class="profile-menu__name">
                Dean Stewart
              </p>

              <p class="profile-menu__meta">
                Pay Tracker v2.6
              </p>
            </div>
          </div>

          <div class="profile-menu__divider"></div>

          <button
            class="profile-menu__item"
            type="button"
            role="menuitem"
            data-profile-action="profile"
          >
            <span
              class="profile-menu__icon"
              aria-hidden="true"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"
                  fill="currentColor"
                />
              </svg>
            </span>

            <span>
              Profile
            </span>
          </button>

          <button
            class="profile-menu__item"
            type="button"
            role="menuitem"
            data-profile-action="settings"
          >
            <span
              class="profile-menu__icon"
              aria-hidden="true"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="m19.14 12.94.04-.94-.04-.94 2.03-1.58-1.92-3.32-2.39.96a7.4 7.4 0 0 0-1.63-.94L14.86 3h-3.72l-.37 3.18c-.58.24-1.12.56-1.63.94l-2.39-.96-1.92 3.32 2.03 1.58-.04.94.04.94-2.03 1.58 1.92 3.32 2.39-.96c.51.38 1.05.7 1.63.94l.37 3.18h3.72l.37-3.18c.58-.24 1.12-.56 1.63-.94l2.39.96 1.92-3.32-2.03-1.58ZM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
                  fill="currentColor"
                />
              </svg>
            </span>

            <span>
              Settings
            </span>
          </button>

          <button
            class="profile-menu__item"
            type="button"
            role="menuitem"
            data-profile-action="about"
          >
            <span
              class="profile-menu__icon"
              aria-hidden="true"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M11 10h2v8h-2v-8Zm0-4h2v2h-2V6Zm1-4a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"
                  fill="currentColor"
                />
              </svg>
            </span>

            <span>
              About Pay Tracker
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
