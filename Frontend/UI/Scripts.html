<script>
  /*******************************************************
   * PAY TRACKER V2.6
   * Frontend/UI/Scripts.html
   *
   * Browser startup and application lifecycle.
   *******************************************************/

  (function payTrackerBrowserBootstrap(window, document) {
    'use strict';

    const STARTUP_CONFIG = Object.freeze({
      APP_NAME: 'Pay Tracker',
      VERSION: '2.6.0',
      CONTROLLER_NAME: 'PayTrackerAppController',
      STARTUP_TIMEOUT_MS: 15000,
      RETRY_DELAY_MS: 250,
      MAX_CONTROLLER_RETRIES: 20
    });

    const startupState = {
      started: false,
      ready: false,
      failed: false,
      retries: 0,
      timeoutId: null,
      startedAt: null
    };

    /**
     * Starts the Pay Tracker browser application.
     *
     * This method is deliberately protected against running more than once.
     */
    function startPayTrackerApplication() {
      if (startupState.started) {
        return;
      }

      startupState.started = true;
      startupState.startedAt = new Date();

      installGlobalErrorHandlers();
      setInitialDocumentState();
      startStartupTimeout();
      waitForController();
    }

    /**
     * Waits until the application controller is available.
     *
     * This small retry window protects against differences in browser parsing
     * order when the application is loaded through Google Apps Script.
     */
    function waitForController() {
      const controller = getApplicationController();

      if (controller) {
        initialiseController(controller);
        return;
      }

      if (startupState.retries >= STARTUP_CONFIG.MAX_CONTROLLER_RETRIES) {
        handleStartupFailure(
          new Error(
            'The Pay Tracker application controller could not be loaded.'
          )
        );
        return;
      }

      startupState.retries += 1;

      window.setTimeout(
        waitForController,
        STARTUP_CONFIG.RETRY_DELAY_MS
      );
    }

    /**
     * Returns the global application controller when available.
     *
     * @return {Object|null}
     */
    function getApplicationController() {
      const controller =
        window[STARTUP_CONFIG.CONTROLLER_NAME];

      if (
        !controller ||
        typeof controller.initialize !== 'function'
      ) {
        return null;
      }

      return controller;
    }

    /**
     * Initialises the main frontend controller.
     *
     * Supports both synchronous and Promise-based controller initialisation.
     *
     * @param {Object} controller Application controller.
     */
    function initialiseController(controller) {
      try {
        const result = controller.initialize(
          getBootstrapPayload()
        );

        if (
          result &&
          typeof result.then === 'function'
        ) {
          result
            .then(handleStartupSuccess)
            .catch(handleStartupFailure);

          return;
        }

        handleStartupSuccess();
      } catch (error) {
        handleStartupFailure(error);
      }
    }

    /**
     * Returns the server-generated application bootstrap payload.
     *
     * @return {Object}
     */
    function getBootstrapPayload() {
      const payload = window.PAY_TRACKER_BOOTSTRAP;

      if (
        payload &&
        typeof payload === 'object'
      ) {
        return payload;
      }

      return {};
    }

    /**
     * Completes successful application startup.
     */
    function handleStartupSuccess() {
      if (startupState.ready) {
        return;
      }

      clearStartupTimeout();

      startupState.ready = true;
      startupState.failed = false;

      document.documentElement.classList.remove(
        'app-is-starting',
        'app-has-error'
      );

      document.documentElement.classList.add(
        'app-is-ready'
      );

      dispatchApplicationEvent(
        'paytracker:ready',
        {
          version: STARTUP_CONFIG.VERSION,
          startedAt: startupState.startedAt,
          readyAt: new Date()
        }
      );
    }

    /**
     * Handles an unrecoverable browser startup failure.
     *
     * @param {*} error Startup failure.
     */
    function handleStartupFailure(error) {
      if (startupState.failed) {
        return;
      }

      clearStartupTimeout();

      startupState.failed = true;
      startupState.ready = false;

      const normalisedError = normaliseError(error);

      document.documentElement.classList.remove(
        'app-is-starting',
        'app-is-ready'
      );

      document.documentElement.classList.add(
        'app-has-error'
      );

      showFatalErrorState(normalisedError);

      logClientError(
        'Pay Tracker startup failed.',
        normalisedError
      );

      dispatchApplicationEvent(
        'paytracker:error',
        {
          phase: 'startup',
          message: normalisedError.message,
          stack: normalisedError.stack || ''
        }
      );
    }

    /**
     * Displays the application-level error state.
     *
     * The main controller normally manages this UI, but this fallback works
     * even when the controller itself cannot start.
     *
     * @param {Error} error Normalised error.
     */
    function showFatalErrorState(error) {
      hideElementById('app-loading-state');
      hideAllApplicationPages();

      const errorState = document.getElementById(
        'app-error-state'
      );

      const errorMessage = document.getElementById(
        'app-error-message'
      );

      if (errorMessage) {
        errorMessage.textContent =
          error.message ||
          'Pay Tracker could not be started.';
      }

      if (errorState) {
        errorState.hidden = false;
      }
    }

    /**
     * Hides all route page containers.
     */
    function hideAllApplicationPages() {
      const pages = document.querySelectorAll(
        '[data-app-page], .app-page'
      );

      pages.forEach(function hidePage(page) {
        page.hidden = true;
      });
    }

    /**
     * Hides an element using its identifier.
     *
     * @param {string} elementId Element identifier.
     */
    function hideElementById(elementId) {
      const element = document.getElementById(
        elementId
      );

      if (element) {
        element.hidden = true;
      }
    }

    /**
     * Establishes the document state before the controller starts.
     */
    function setInitialDocumentState() {
      document.documentElement.classList.add(
        'app-is-starting'
      );

      document.documentElement.classList.remove(
        'app-is-ready',
        'app-has-error'
      );

      const loadingState = document.getElementById(
        'app-loading-state'
      );

      const errorState = document.getElementById(
        'app-error-state'
      );

      if (loadingState) {
        loadingState.hidden = false;
      }

      if (errorState) {
        errorState.hidden = true;
      }
    }

    /**
     * Starts the maximum startup-duration timer.
     */
    function startStartupTimeout() {
      clearStartupTimeout();

      startupState.timeoutId = window.setTimeout(
        function handleStartupTimeout() {
          handleStartupFailure(
            new Error(
              'Pay Tracker took too long to start. Please refresh the page.'
            )
          );
        },
        STARTUP_CONFIG.STARTUP_TIMEOUT_MS
      );
    }

    /**
     * Clears the startup timer.
     */
    function clearStartupTimeout() {
      if (startupState.timeoutId === null) {
        return;
      }

      window.clearTimeout(
        startupState.timeoutId
      );

      startupState.timeoutId = null;
    }

    /**
     * Installs browser-level error boundaries.
     */
    function installGlobalErrorHandlers() {
      window.addEventListener(
        'error',
        handleWindowError
      );

      window.addEventListener(
        'unhandledrejection',
        handleUnhandledRejection
      );
    }

    /**
     * Handles uncaught JavaScript errors.
     *
     * @param {ErrorEvent} event Browser error event.
     */
    function handleWindowError(event) {
      const error = normaliseError(
        event.error || event.message
      );

      logClientError(
        'Unhandled browser error.',
        error
      );

      dispatchApplicationEvent(
        'paytracker:client-error',
        {
          type: 'error',
          message: error.message,
          filename: event.filename || '',
          line: event.lineno || 0,
          column: event.colno || 0,
          stack: error.stack || ''
        }
      );
    }

    /**
     * Handles rejected Promises without a rejection handler.
     *
     * @param {PromiseRejectionEvent} event Rejection event.
     */
    function handleUnhandledRejection(event) {
      const error = normaliseError(
        event.reason
      );

      logClientError(
        'Unhandled Promise rejection.',
        error
      );

      dispatchApplicationEvent(
        'paytracker:client-error',
        {
          type: 'unhandledrejection',
          message: error.message,
          stack: error.stack || ''
        }
      );
    }

    /**
     * Converts unknown failure values into Error instances.
     *
     * @param {*} value Failure value.
     * @return {Error}
     */
    function normaliseError(value) {
      if (value instanceof Error) {
        return value;
      }

      if (
        value &&
        typeof value === 'object' &&
        value.message
      ) {
        const error = new Error(
          String(value.message)
        );

        if (value.stack) {
          error.stack = String(value.stack);
        }

        return error;
      }

      if (typeof value === 'string') {
        return new Error(value);
      }

      return new Error(
        'An unexpected Pay Tracker error occurred.'
      );
    }

    /**
     * Writes a structured error to the browser console.
     *
     * @param {string} context Error context.
     * @param {Error} error Error object.
     */
    function logClientError(context, error) {
      if (
        !window.console ||
        typeof window.console.error !== 'function'
      ) {
        return;
      }

      window.console.error(
        '[' + STARTUP_CONFIG.APP_NAME + '] ' + context,
        error
      );
    }

    /**
     * Dispatches a custom Pay Tracker browser event.
     *
     * @param {string} eventName Event name.
     * @param {Object} detail Event details.
     */
    function dispatchApplicationEvent(
      eventName,
      detail
    ) {
      try {
        const event = new CustomEvent(
          eventName,
          {
            detail: detail || {}
          }
        );

        window.dispatchEvent(event);
      } catch (error) {
        logClientError(
          'Could not dispatch event "' +
            eventName +
            '".',
          normaliseError(error)
        );
      }
    }

    /**
     * Retries application startup after a fatal failure.
     */
    function retryApplicationStartup() {
      clearStartupTimeout();

      startupState.started = false;
      startupState.ready = false;
      startupState.failed = false;
      startupState.retries = 0;
      startupState.startedAt = null;

      startPayTrackerApplication();
    }

    /**
     * Connects the fallback retry button.
     */
    function registerRetryButton() {
      const retryButton = document.getElementById(
        'app-retry-button'
      );

      if (!retryButton) {
        return;
      }

      retryButton.addEventListener(
        'click',
        retryApplicationStartup
      );
    }

    /**
     * Runs browser startup once the document is ready.
     */
    function onDocumentReady() {
      registerRetryButton();
      startPayTrackerApplication();
    }

    /**
     * Exposes limited lifecycle information for diagnostics.
     */
    window.PayTrackerBrowser = Object.freeze({
      start: startPayTrackerApplication,
      retry: retryApplicationStartup,

      getState: function getState() {
        return {
          started: startupState.started,
          ready: startupState.ready,
          failed: startupState.failed,
          retries: startupState.retries,
          startedAt: startupState.startedAt
        };
      },

      getVersion: function getVersion() {
        return STARTUP_CONFIG.VERSION;
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        onDocumentReady,
        {
          once: true
        }
      );
    } else {
      onDocumentReady();
    }
  })(window, document);
</script>
